<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报名系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="event-name">加载中...</h1>
      <p id="event-desc" class="desc"></p>
      <p id="deadline-info" class="deadline"></p>
    </header>
    <form id="register-form">
      <div id="form-fields"></div>
      <button type="submit" class="btn-primary">提交报名</button>
    </form>
    <div id="success-msg" class="success-msg" style="display:none;">
      <div class="success-icon">🎉</div>
      <h2>报名成功！</h2>
      <p>感谢你的参与，祝你取得好成绩！</p>
      <button onclick="location.reload()" class="btn-secondary">再报一个</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
