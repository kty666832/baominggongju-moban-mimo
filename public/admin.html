<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container admin-container">
    <div id="login-section">
      <h1>🔧 管理后台</h1>
      <form id="login-form">
        <div class="form-group">
          <label>管理密码</label>
          <input type="password" id="admin-password" placeholder="请输入管理密码" required>
        </div>
        <button type="submit" class="btn-primary">登录</button>
      </form>
    </div>
    <div id="admin-panel" style="display:none;">
      <div class="admin-header">
        <h1>📊 报名数据管理</h1>
        <div class="admin-actions">
          <button onclick="exportCSV()" class="btn-secondary">📥 导出CSV</button>
          <button onclick="refreshData()" class="btn-secondary">🔄 刷新</button>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-number" id="total-count">0</span>
          <span class="stat-label">报名总数</span>
        </div>
        <div id="group-stats" class="group-stats"></div>
      </div>
      <div class="table-wrapper">
        <table id="data-table">
          <thead id="table-header"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
